name: Deploy SWA (front + API)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["swa/**", "api/**", ".github/workflows/swa.yml"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: swa/package-lock.json

      - name: Build SPA
        working-directory: swa
        env:
          # En Azure la SPA siempre va contra /api; el mock lo decide MOCK_MODE en la API.
          VITE_DATA_SOURCE: api
        run: |
          npm ci
          npm run build

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build API (managed functions, .NET 10 isolated)
        run: dotnet publish api/Wh3d.Api.csproj -c Release -o api/publish

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: swa/dist
          api_location: api/publish
          config_file_location: swa
          skip_app_build: true
          skip_api_build: true
